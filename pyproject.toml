[project]
name = "f1-race-prediction"
version = "0.1.0"
description = "Predicting F1 race finishing positions from pre-race features, with leakage-safe validation"
requires-python = ">=3.12"

dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # --- Database ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",

    # --- F1 data ---
    "fastf1>=3.8.3",
    "pandas>=2.2",
    "numpy>=1.26",

    # --- CLI ---
    "typer>=0.15",

    # --- ML ---
    "scikit-learn>=1.5",
    "xgboost>=3.4.1",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]
notebook = ["jupyterlab>=4.3", "matplotlib>=3.9", "seaborn>=0.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes its own scaffolding; the generated DDL lines are long by
# nature and reformatting them would obscure the diff against what ran.
extend-exclude = ["alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and typer argument defaults are the correct idiom here, not the
# B008 mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "typer.Argument", "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
